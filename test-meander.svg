<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e197"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997a15"/>
    </linearGradient>
    <pattern id="meanderH" width="48" height="48" patternUnits="userSpaceOnUse">
      <!-- Background ribbon -->
      <rect width="48" height="48" fill="#0d1b2a"/>
      <!-- Outer/Inner bars -->
      <rect x="0" y="0" width="48" height="6" fill="url(#goldGrad)"/>
      <rect x="0" y="42" width="48" height="6" fill="url(#goldGrad)"/>
      <!-- Interlocking teeth -->
      <path d="M 6,6 V 30 H 24 V 18 H 18 V 24" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M 42,42 V 18 H 24 V 30 H 30 V 24" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
    </pattern>
  </defs>
  <rect width="180" height="180" fill="#0a192f"/>
</svg>
